services:
  traefik:
    image: traefik:latest
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml"
      - "./letsencrypt:/letsencrypt"
    networks:
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`darklordvpn.ddns.net`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.service=api@internal"
      # ← Remove these two lines completely:
      # - "traefik.http.middlewares.dashboard-stripprefix.stripprefix.prefixes=/dashboard,/api"
      # - "traefik.http.routers.dashboard.middlewares=dashboard-stripprefix"

networks:
  traefik:
    external: true
