log:
  level: DEBUG

accessLog: {}

api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  docker:
    exposedByDefault: false
    # network: traefik   # uncomment if you want to force it

certificatesResolvers:
  le:
    acme:
      email: bel-g-stylas@hotmail.com
      storage: /letsencrypt/acme.json
      tlsChallenge: {}
